[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filter-robustness"
version = "0.1.0"
description = "Adversarial robustness testing for text classification filters"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Primel Jayawardana" },
]

dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
